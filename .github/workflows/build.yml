name: Build

on:
  pull_request:
    branches: [ master, dev ]
    paths: &paths
      # The JavaScript and CSS sources and the committed build.
      - 'assets/src/**'
      # These files configure NPM and the build. Changes could affect the outcome.
      - 'package*.json'
      - 'webpack.config.js'
      - '.nvmrc'
      # Changes to workflow files should always verify all workflows are successful.
      - '.github/workflows/*.yml'
  push:
    branches: [ master, dev ]
    paths: *paths
  # Allows you to run this workflow manually from the Actions tab.
  workflow_dispatch:

# Cancel superseded runs of pull requests. Runs on pushes to the branches are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # Checks the JavaScript and CSS build, not committed, succeeds.
  #
  # Performs the following steps:
  # - Checks out the repository.
  # - Installs NodeJS with caching for NPM.
  # - Logs updated debug information.
  # - Installs NPM dependencies.
  # - Builds the JavaScript and CSS with @wordpress/scripts.
  build:
    name: JavaScript and CSS build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Log debug information
        run: |
          npm --version
          node --version

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build
